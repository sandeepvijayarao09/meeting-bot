<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meeting Bot — microphone access</title>
    <style>
      body {
        font: 15px -apple-system, system-ui, sans-serif;
        max-width: 480px;
        margin: 80px auto;
        color: #222;
      }
      button {
        padding: 10px 18px;
        font-size: 15px;
        border: 0;
        border-radius: 8px;
        background: #2e7d32;
        color: white;
        cursor: pointer;
      }
      #result { margin-top: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <h2>🎙 Meeting Bot needs your microphone</h2>
    <p>
      Chrome only shows the microphone permission prompt on a full page, not in the
      extension popup. Click below and choose <b>Allow</b> — you only do this once.
    </p>
    <button id="ask">Enable microphone</button>
    <div id="result"></div>
    <script src="permission.js"></script>
  </body>
</html>

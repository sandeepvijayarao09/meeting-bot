name: MB
options:
  bundleIdPrefix: ai.meetingbot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # The shared, multiplatform Swift package (capture + pipeline) lives alongside
  # the macOS app. The iOS app links its CaptureKit + MeetingBotKit products.
  MeetingBot:
    path: ../../mac

targets:
  MB:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: MB-Info.plist
      properties:
        CFBundleDisplayName: MB
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndefiniteAppExtensions: false
        # Keep capturing when the screen locks or the user switches apps — a meeting
        # recorder that stops on backgrounding is a functional defect (Guideline 2.1).
        # Justified: recording is explicitly user-initiated and shown in-app.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "MB records the microphone to transcribe your meeting on this device."
        NSSpeechRecognitionUsageDescription: "MB transcribes recorded meeting audio on this device, on device."
        # Export compliance: MB uses only standard HTTPS/TLS (exempt encryption).
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.meetingbot.mb.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Simulator/dev builds don't need signing; set DEVELOPMENT_TEAM + a
        # provisioning profile in Xcode (or CI) for device/App Store builds.
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - package: MeetingBot
        product: CaptureKit
      - package: MeetingBot
        product: MeetingBotKit

  MBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    # Hosted by the app so `@testable import MB` can reach internal types. xcodegen
    # wires TEST_HOST + adds this target to MB's scheme Test action automatically.
    dependencies:
      - target: MB
      - package: MeetingBot
        product: MeetingBotKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.9"

[project]
name = "meetingbot"
version = "1.0.1"
description = "Local-first AI meeting notetaker for macOS: on-device Whisper transcription, free NVIDIA NIM summaries, exports to Markdown / Apple Notes / Google Docs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sandeep Vijayarao", email = "vijayarao.s@northeastern.edu" }]
keywords = ["meeting", "transcription", "whisper", "notes", "macos", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    "mlx-whisper>=0.4.1",
    "numpy>=1.26",
    "openai>=1.40",
    "typer>=0.12",
    "rumps>=0.4",
    "python-dotenv>=1.0",
    # >=15: the capture server passes re.Pattern entries to serve(origins=...),
    # which only 15.0+ matches (older versions reject every extension handshake).
    "websockets>=15",
    "markdown>=3.10.2",
    "google-api-python-client>=2.197.0",
    "google-auth>=2.54.0",
    "google-auth-oauthlib>=1.4.0",
]

[project.optional-dependencies]
# Speaker diarization (heavy; opt-in via MBOT_DIARIZE). Install: uv sync --extra diarize
diarize = ["pyannote.audio>=3.1", "torch>=2.2"]

[project.urls]
Homepage = "https://github.com/sandeepvijayarao09/meeting-bot"
Repository = "https://github.com/sandeepvijayarao09/meeting-bot"
Issues = "https://github.com/sandeepvijayarao09/meeting-bot/issues"

[project.scripts]
mbot = "meetingbot.cli:app"
mbot-menubar = "meetingbot.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meetingbot"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# typer uses these calls as parameter defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
files = ["meetingbot"]
strict = true
disallow_subclassing_any = false  # rumps.App is untyped

[[tool.mypy.overrides]]
module = [
    "mlx_whisper.*",
    "rumps.*",
    "markdown.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.auth.*",
    "google.oauth2.*",
    "pyannote.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["stress: large randomized end-to-end pipeline run (1000 cases)"]

[tool.coverage.run]
# Scope coverage via config (NOT a `--cov=meetingbot` CLI arg): one test inspects
# `ps` output and the literal "meetingbot" in argv would fool its process check.
source = ["meetingbot"]
omit = ["meetingbot/app.py"]  # rumps menu-bar dev UI — exercised manually, not unit-tested

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

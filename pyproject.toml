[project]
name = "meetingbot"
version = "0.1.0"
description = "Local Granola-style meeting notetaker: ScreenCaptureKit capture + local Whisper + NVIDIA NIM summaries"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.1",
    "numpy>=1.26",
    "openai>=1.40",
    "typer>=0.12",
    "rumps>=0.4",
    "python-dotenv>=1.0",
    "websockets>=13",
    "markdown>=3.10.2",
    "google-api-python-client>=2.197.0",
    "google-auth>=2.54.0",
    "google-auth-oauthlib>=1.4.0",
]

[project.scripts]
mbot = "meetingbot.cli:app"
mbot-menubar = "meetingbot.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meetingbot"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# typer uses these calls as parameter defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
files = ["meetingbot"]
strict = true
disallow_subclassing_any = false  # rumps.App is untyped

[[tool.mypy.overrides]]
module = [
    "mlx_whisper.*",
    "rumps.*",
    "markdown.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.auth.*",
    "google.oauth2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

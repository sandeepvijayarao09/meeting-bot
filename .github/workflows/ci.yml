name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Apple Silicon runner: needed for Swift, ScreenCaptureKit, mlx wheels, and the
    # iOS simulator. Runs the exact same gate as `make check`.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pin the newest stable Xcode on the runner. The image's default Xcode lags
      # and can miss current SwiftUI APIs (e.g. openSettings) / concurrency
      # behavior, so select latest-stable to match the development toolchain.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install XcodeGen (iOS project generation)
        run: brew install xcodegen

      # One gate: ruff + mypy + pytest (coverage >= 80%) + swift build/lint/test +
      # Chrome-extension tsc/tests + iOS build & unit tests.
      - name: make check
        run: make check
